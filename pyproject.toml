[project]
name = "cosac-security-agents"
version = "0.1.0"
description = "TRACE reference agents for agentic security demonstrations on AWS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# boto3 is a TEST dependency here, not a runtime one. The agents keep
# `dependencies = []` on purpose -- Lambda provides boto3, and the AgentCore
# package vendors it because that runtime does not. But the handler tests
# import the handlers, the handlers import boto3, and CI installs only this
# extra. It collected fine locally, where boto3 happens to be present, and
# failed on the runner with ModuleNotFoundError.
dev = ["pytest>=8.0", "ruff>=0.6", "boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
